  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

/* Is a point inside a projected face? Faces arrive already projected, as flat
   arrays of x,y pairs, because the projection happens once per face rather
   than once per lattice point. */
function fxInPoly(px, py, p) {
  var inside = false;
  for (var i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    var xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

/* Stipple.

   fxDotArt puts a dot at every lattice site and varies its RADIUS. That is a
   halftone, and it reads as mechanical because the eye finds the lattice
   before it finds the subject. The reference work does the opposite: dot size
   is nearly constant and what varies is how MANY dots land in a given area.
   Tone comes from density, and the positions are irregular.

   So: rejection sampling against a density field. Candidates are thrown at
   the frame and kept with probability equal to the field, which makes the
   count per unit area proportional to the field by construction, with no
   lattice anywhere. Colour still comes from where a dot lands, so a gradient
   crosses the whole image while only the dots reveal it.

   `glyph` matters more than it looks. The murmuration reference is not built
   from circles: a mark with a direction to it reads as a thing rather than as
   a dot, and a field of them reads as a flock. */
function fxStipple(ctx, W, H, ramp, k, opt) {
  var rnd = fxRand(opt.seed || 5);
  var want = opt.count || 6000;
  var ax = opt.axis || [0, 0, 1, 1];
  var dx = ax[2] - ax[0], dy = ax[3] - ax[1];
  var len2 = dx * dx + dy * dy || 1;
  var lo = opt.t0 == null ? 0 : opt.t0, hi = opt.t1 == null ? 1 : opt.t1;
  var rMin = opt.rMin == null ? 0.8 : opt.rMin;
  var rMax = opt.rMax == null ? 2.4 : opt.rMax;
  var aLo = opt.aLo == null ? 0.55 : opt.aLo;
  var aHi = opt.aHi == null ? 1.0 : opt.aHi;
  var glyph = opt.glyph || 'dot';
  var dens = opt.density;

  /* An envelope, not blind rejection.

     Throwing candidates at the whole frame and keeping them with probability
     equal to the density is correct and ruinously slow: a form that occupies
     a twentieth of the frame at a tenth of full density needs two hundred
     candidates per mark, and each one costs a density evaluation. Eight
     panels of that took five seconds, and the canvas runtime kills a preview
     that stops answering it. This board shipped broken for exactly that
     reason, and no check here could see it, because the smoke test makes
     drawing free and never looks at the clock.

     So: sample the field once onto a coarse grid, pick a CELL in proportion
     to its weight, then jitter inside it. Acceptance is against the cell's
     own maximum rather than against 1, so it stays near certain wherever the
     field is smooth and only does real work at a hard edge.

     Each cell is probed at four points: the mean becomes its weight and the
     max its envelope. Probing only the centre would under-estimate any cell a
     hard edge crosses, and Erosion, Threshold and Skyline are all hard
     edges. */
  var G = opt.grid || 72;
  var w = [], env = [], cum = [], run = 0, i;
  for (i = 0; i < G * G; i++) {
    var gx = i % G, gy = (i / G) | 0;
    var m = 0, mx = 0;
    for (var q = 0; q < 4; q++) {
      var su = (gx + (q & 1 ? 0.75 : 0.25)) / G;
      var sv = (gy + (q & 2 ? 0.75 : 0.25)) / G;
      var d0 = dens(su, sv);
      if (!(d0 > 0)) d0 = 0;
      m += d0 * 0.25;
      if (d0 > mx) mx = d0;
    }
    w[i] = m;
    env[i] = mx * 1.18;
    run += m;
    cum[i] = run;
  }
  if (!(run > 0)) return 0;

  var placed = 0, guard = 0, cap = want * 8;
  var CACHE = {};
  ctx.save();
  ctx.globalCompositeOperation = opt.mode || 'source-over';
  ctx.lineCap = 'round';
  while (placed < want && guard < cap) {
    guard++;
    var target = rnd() * run;
    var a0 = 0, b0 = G * G - 1;
    while (a0 < b0) { var mid = (a0 + b0) >> 1; if (cum[mid] < target) a0 = mid + 1; else b0 = mid; }
    var e = env[a0];
    if (!(e > 0)) continue;
    var cx0 = a0 % G, cy0 = (a0 / G) | 0;
    var u = (cx0 + rnd()) / G, v = (cy0 + rnd()) / G;
    var d = dens(u, v);
    if (!(d > 0)) continue;
    if (d < e && rnd() > d / e) continue;
    placed++;
    var x = u * W, y = v * H;
    var t = ((u - ax[0]) * dx + (v - ax[1]) * dy) / len2;
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    var dd = d > 1 ? 1 : d;

    /* Quantise, then cache the style string.

       Every mark otherwise costs a full OKLCH to sRGB conversion, which is
       two cube roots and three powers, plus a toFixed and four concatenations
       to build the rgba string. At tens of thousands of marks that was the
       single most expensive thing on the board, well ahead of the density
       field. 128 steps of position and 32 of alpha are more resolution than a
       stipple can show, and they turn tens of thousands of conversions into
       at most four thousand. */
    var ti = (t * 127) | 0, ai = (dd * 31) | 0;
    var key = ti * 32 + ai;
    var style = CACHE[key];
    if (style === undefined) {
      var c = ramp(lo + (hi - lo) * (ti / 127), k);
      style = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (aLo + (aHi - aLo) * (ai / 31)).toFixed(3) + ')';
      CACHE[key] = style;
    }
    ctx.fillStyle = style;
    ctx.strokeStyle = style;
    var r = rMin + (rMax - rMin) * rnd() * rnd();
    if (glyph === 'square') {
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    } else if (glyph === 'dash') {
      var an = (opt.angle == null ? 1.35 : opt.angle) + (rnd() - 0.5) * (opt.spin == null ? 0.5 : opt.spin);
      ctx.lineWidth = r * 0.9;
      ctx.beginPath();
      ctx.moveTo(x - Math.cos(an) * r * 2.2, y - Math.sin(an) * r * 2.2);
      ctx.lineTo(x + Math.cos(an) * r * 2.2, y + Math.sin(an) * r * 2.2);
      ctx.stroke();
    } else if (glyph === 'bird') {
      /* Two strokes meeting at a point. Enough of a wing to read as one at
         two millimetres and as texture at arm's length. */
      var bb = (opt.angle == null ? 0 : opt.angle) + (rnd() - 0.5) * (opt.spin == null ? 0.9 : opt.spin);
      var sz = r * 2.1, ca = Math.cos(bb), sa = Math.sin(bb);
      ctx.lineWidth = Math.max(0.7, r * 0.62);
      ctx.beginPath();
      ctx.moveTo(x - ca * sz - sa * sz * 0.55, y - sa * sz + ca * sz * 0.55);
      ctx.lineTo(x, y);
      ctx.lineTo(x + ca * sz - sa * sz * 0.55, y + sa * sz + ca * sz * 0.55);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 6.283185);
      ctx.fill();
    }
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
  return placed;
}

/* A density field painted as ordinary shapes.

   The abstract forms are closed-form maths, which is fine for a wash and
   hopeless for anything that has to be RECOGNISED. A server rack is not an
   equation; it is forty rectangles.

   So: paint the subject onto a small offscreen canvas in greys, where white
   is full density and black is none, then read it back once and hand out a
   sampler. After that the subject is just a drawing function, and anything
   that can be drawn can be stippled: a traced skyline, a wordmark, a logo,
   a silhouette off a photograph.

   Sampled at a fraction of the real size, because the stipple only ever asks
   for a coarse envelope and a few thousand point queries. Bilinear on the way
   out, so a hard edge lands somewhere sensible instead of on a pixel
   boundary, and so the grain of the mask never shows through as its own
   texture. */
function fxMaskFrom(paint, W, H, sub) {
  var s = sub || 3;
  var c = document.createElement('canvas');
  var cw = Math.max(4, Math.round(W / s)), ch = Math.max(4, Math.round(H / s));
  c.width = cw; c.height = ch;
  var g = c.getContext('2d');
  g.fillStyle = '#000000';
  g.fillRect(0, 0, cw, ch);
  g.save();
  g.scale(cw / W, ch / H);
  paint(g, W, H);
  g.restore();
  var d = g.getImageData(0, 0, cw, ch).data;
  return function (u, v) {
    var x = u * cw - 0.5, y = v * ch - 0.5;
    var x0 = Math.floor(x), y0 = Math.floor(y);
    var fx = x - x0, fy = y - y0;
    var x1 = x0 + 1, y1 = y0 + 1;
    if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0;
    if (x1 > cw - 1) x1 = cw - 1; if (y1 > ch - 1) y1 = ch - 1;
    if (x0 > cw - 1) x0 = cw - 1; if (y0 > ch - 1) y0 = ch - 1;
    var a = d[(y0 * cw + x0) * 4], b = d[(y0 * cw + x1) * 4];
    var e = d[(y1 * cw + x0) * 4], f = d[(y1 * cw + x1) * 4];
    return ((a + (b - a) * fx) + ((e + (f - e) * fx) - (a + (b - a) * fx)) * fy) / 255;
  };
}


var A_D = [[0.22,0.105,295],[0.45,0.125,258],[0.68,0.11,215],[0.97,0.045,92]];
var A_L = [[0.96,0.045,88],[0.76,0.105,30],[0.56,0.13,350],[0.4,0.13,300]];
var A_FD = [[0.28,0.09,298],[0.36,0.1,340],[0.42,0.092,25],[0.5,0.068,88]];
function em(t, k) { return anchorRamp(A_D, t, k); }
function ik(t, k) { return anchorRamp(A_L, t, k); }
function fd(t, k) { return anchorRamp(A_FD, t, k); }

class Component extends DCLogic {
  componentDidMount() { this.draw(); }
  componentDidUpdate() { this.draw(); }
  draw() {
    var cv = document.getElementById('cv');
    if (!cv) { requestAnimationFrame(this.draw.bind(this)); return; }
    var ctx = cv.getContext('2d'), W = cv.width, H = cv.height, S = 2;
    var k = this.props.chroma != null ? this.props.chroma : 1;
    var O = { ox: 1520, oy: 880, sx: 1180, sy: 520, hz: 400 };
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#131312'; ctx.fillRect(0, 0, W, H);

    fxField(ctx, W, H, fd, k * 2.4, [{"x":0.8,"y":0.26,"r":0.5,"t":0.92,"a":0.9},{"x":1.04,"y":0.7,"r":0.44,"t":0.55,"a":0.75},{"x":0.52,"y":1.06,"r":0.58,"t":0.16,"a":0.66},{"x":0.3,"y":-0.12,"r":0.46,"t":0.34,"a":0.3}], 'lighter');
    var peakK = maxOf(KDE), li, lr, lc;
    for (li = 0; li < KDE.length; li++) {
      var lift = 0.05 + li * 0.18;
      var tCol = li / (KDE.length - 1);
      ctx.globalCompositeOperation = 'source-over';
      var corners = [[0, 0], [1, 0], [1, 1], [0, 1]];
      ctx.beginPath();
      for (lr = 0; lr < 4; lr++) {
        var cp = isoPoint(corners[lr][0], corners[lr][1], lift, O);
        if (lr === 0) ctx.moveTo(cp[0], cp[1]); else ctx.lineTo(cp[0], cp[1]);
      }
      ctx.closePath();
      ctx.fillStyle = rgba(em(0.10 + tCol * 0.28, k), 0.055);
      ctx.fill();
      ctx.strokeStyle = rgba(em(0.35 + tCol * 0.40, k), 0.18);
      ctx.lineWidth = 1 * S; ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      for (lc = 0; lc <= 132; lc++) {
        var u = lc / 132;
        var dens = sampleAt(KDE[li], u) / peakK;
        if (dens <= 0.02) continue;
        for (lr = 0; lr <= 22; lr++) {
          var v = lr / 22;
          var jit = 0.5 + 0.5 * Math.cos(lc * 1.7 + lr * 2.3);
          var amp = dens * (0.55 + 0.45 * jit);
          var pp = isoPoint(u, v, lift, O);
          ctx.fillStyle = rgbs(em(0.30 + 0.62 * amp, k));
          ctx.globalAlpha = 0.22 + 0.58 * amp;
          ctx.beginPath(); ctx.arc(pp[0], pp[1], (0.45 + 2.6 * Math.pow(amp, 1.2)) * S, 0, 6.283185); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';

    fxGrain(ctx, W, H, (this.props.grain != null ? this.props.grain : 0.075), 7, 1);
  }
  renderVals() { return {}; }
}
</script>
